[package]
name = "ember-rs"
version = "0.6.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[dependencies]
bitflags = "2.13.1"
log = "0.4.33"

[build-dependencies]
bindgen = "0.72"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
